<title>YEOUIDO DRIVE — 8조 여의도 자율주행 프로젝트</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css">
<style>
/* ===== 추가 섹션: 학습 단계 · 결과 · 주행 영상 (style.css 톤에 맞춤) ===== */
.x-flow4{grid-template-columns:1fr 36px 1fr 36px 1fr 36px 1fr}
.x-flow4 .flow-icon{font-size:18px;font-weight:750}
.x-flow4 p{word-break:keep-all}
.x-flow4 + .research-note{margin-top:16px}
.results .facts{margin-bottom:16px}
.results .facts strong{color:var(--ink)}
.x-tables{display:grid;grid-template-columns:3fr 2fr;gap:16px}
.x-card{padding:25px 23px;border:1px solid var(--line);border-radius:14px;background:#fff;min-width:0;overflow-x:auto}
.x-card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.x-card-head h3{font-size:18px;font-weight:700;letter-spacing:-.04em;margin:0}
.x-card-head span{font-size:10px;letter-spacing:.1em;color:#8a95a5;font-weight:650}
.x-card table{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
.x-card th,.x-card td{padding:11px 8px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
.x-card tbody tr:last-child td{border-bottom:0}
.x-card th:first-child,.x-card td:first-child{text-align:left}
.x-card th{font-size:11px;letter-spacing:.08em;color:#8a95a5;font-weight:650}
.x-card td{color:var(--muted)}
.x-card td:first-child{color:var(--ink);font-weight:550}
.x-card tr.x-final td{color:var(--blue);font-weight:700;background:#f7f9ff}
.x-figure{margin-top:16px}
.x-figure img{display:block;width:100%;border-radius:10px}
.x-pending{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;min-height:240px;background:#fafbfd;border:1px dashed #dce3ed;border-radius:10px;color:var(--muted);font-size:14px;text-align:center;padding:24px}
.x-pending .pending-label{margin-top:0;align-self:center}
.x-video{background:#0e2034;border-radius:22px;overflow:hidden;box-shadow:0 24px 60px #1735521c}
.x-video .map-top{padding-bottom:18px}
.x-video-frame{aspect-ratio:16/9;background:#172b40}
.x-video-frame video,.x-video-frame iframe{display:block;width:100%;height:100%;border:0}
.x-video-frame .x-pending{height:100%;min-height:0;background:transparent;border:0;border-radius:0;color:#91a7b9}
.x-video-frame .pending-label{background:#193249;color:#bad2e5}
.x-video .map-caption{margin:14px 23px 17px}
@media(max-width:1000px){.x-flow4{grid-template-columns:1fr 1fr;row-gap:28px}.x-flow4 .flow-connector{display:none}.x-tables{grid-template-columns:1fr}}
@media(max-width:760px){.x-flow4{grid-template-columns:1fr;row-gap:20px}.x-card{padding:20px 16px}.x-video{border-radius:17px}}
</style>
<script defer src="app.js"></script>
</head>
